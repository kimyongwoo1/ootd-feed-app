name: app
description: "MP3 미니 피드 앱 - 좋아요·댓글·신고"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0   # Supabase (DB + 익명 인증)
  flutter_dotenv: ^5.2.1     # .env 에서 설정 키 읽기

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env   # 실제 키는 .env 에만 (ZIP·GitHub 에 올리지 않음)
